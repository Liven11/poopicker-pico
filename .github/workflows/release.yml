# Releases the firmware on a tag, with SLSA Level 3 provenance.
#
# SLSA v2.1.0: https://github.com/slsa-framework/slsa-github-generator/tree/v2.1.0
#
# Why provenance matters here more than usual: the artifact is a firmware image
# that gets flashed onto a console, and the payload table it carries decides
# which exploit runs. Provenance lets someone confirm the UF2 in a release came
# from this repo at this tag, rather than from somewhere that merely looks like
# it did.
#
# The generator signs with GitHub's OIDC key, so there is no long-lived signing
# key to leak or rotate. It attests to the *build*, not to the chain working —
# see the caveat in the README.
name: Release

on:
  push:
    tags: ['v*']
  # Manual re-runs publish to an existing tag, given as v0.1.0. A bare ref
  # creates a confusing half-tagged run where the release and the tag disagree.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, without the v (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  # Resolves which tag is being released, once, so build/release/provenance all
  # agree. Without this the release name comes from the tag push while a manual
  # run has to be told, and the two paths drift apart.
  tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Work out the tag
        id: resolve
        env:
          # Refs are not interpolated into shell; the tag reaches bash as a
          # plain environment variable.
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            raw="${INPUT_TAG:-}"
            raw="${raw#v}"                       # accept 0.1.0 or v0.1.0
            if [ -z "$raw" ]; then
              echo "::error::the 'tag' input is required"
              exit 1
            fi
            name="v$raw"
            ref="refs/tags/$name"
            # Checked through the API rather than `git ls-remote`, because this
            # job deliberately does no checkout, so there is no origin remote to
            # ask. Fails here, with an instruction, instead of after a full build.
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$name" >/dev/null 2>&1; then
              echo "::error::tag $name does not exist. Create it first:"
              echo "  git tag -a $name -m '...' && git push origin $name"
              exit 1
            fi
          else
            name="${HEAD_REF#refs/tags/}"
            ref="$HEAD_REF"
          fi
          echo "Releasing $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tag
    # No `permissions` block of its own: inherits read-only. The release job is
    # the only one that needs write.
    outputs:
      base64-subjects: ${{ steps.subjects.outputs.base64-subjects }}
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tagged commit, not the ref that triggered the run. These
          # differ on a manual re-run of a workflow_dispatch.
          ref: ${{ needs.tag.outputs.ref }}

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@7ef629dcdf0f458ab7ae83149d629443deac6eac # v2.0.0
        with:
          version: 1.x

      - name: Add the arduino-pico board index
        run: |
          arduino-cli config set board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

      - name: Install the RP2350 core
        run: |
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.1.1

      - name: Test path resolution
        run: python3 embedded/tools/test_resolve.py

      - name: Compile
        run: |
          arduino-cli compile \
            -b rp2040:rp2040:rpipico2w:flash=4194304_131072 \
            --warnings all \
            --export-binaries \
            PS5-Server-Pico/PS5_Server_Pico

      - name: Collect the artifact
        run: |
          mkdir -p dist
          cp PS5-Server-Pico/PS5_Server_Pico/build/rp2040.rp2040.rpipico2w/PS5_Server_Pico.ino.uf2 \
             dist/PS5_Server_Pico.uf2

      # The generator wants "SHA256 NAME" lines, base64 encoded. Encoding it in a
      # step output rather than inline keeps the value out of the workflow file,
      # which is the pattern SLSA documents for avoiding script injection.
      - name: Compute subjects for provenance
        id: subjects
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum PS5_Server_Pico.uf2 | base64 -w0 > subjects.b64
          echo "base64-subjects=$(cat subjects.b64)" >> "$GITHUB_OUTPUT"
          cat subjects.b64

      - name: Upload the UF2 as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-uf2
          path: dist/PS5_Server_Pico.uf2
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [tag, build]
    permissions:
      contents: write
    steps:
      - name: Download the UF2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-uf2
          path: dist

      # Published, not draft, and named/tagged explicitly rather than inferred.
      #
      # A draft release is invisible to the SLSA generator's tag lookup, so a
      # draft here means provenance attaches to nothing. And on the first
      # attempt this run produced two releases for one tag: a draft from this
      # job and an empty second one from the generator, both for v0.1.0. Naming
      # the tag here makes both steps target the same release.
      #
      # target_commitish is the resolved commit, so the release always points at
      # the code that was built even on a manual re-run.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: dist/PS5_Server_Pico.uf2
          generate_release_notes: false
          name: ${{ needs.tag.outputs.name }}
          tag_name: ${{ needs.tag.outputs.name }}
          target_commitish: ${{ needs.build.outputs.sha }}
          body: |
            ## Flash it

            Hold **BOOT** while plugging the Pico 2 W in, then drop
            `PS5_Server_Pico.uf2` onto the `RPI-RP2` volume.

            Join the `PS5_WEB_AP` access point and open the User's Guide on the
            console.

            Verify against the `*.intoto.jsonl` provenance in this release — it
            is signed by GitHub's OIDC key and attests to this build at this tag.

            ## Caveat

            Compiled and path-tested, **not yet verified on hardware or a live
            console**. See the README.

  provenance:
    name: SLSA provenance
    needs: [tag, build, release]
    permissions:
      actions: read       # the generator reads workflow run info
      id-token: write     # keyless OIDC signing
      contents: write     # attach provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.base64-subjects }}
      upload-assets: true
      # Required on a manual run: the generator's own tag lookup is gated on
      # startsWith(github.ref, 'refs/tags/'), which is false for a
      # workflow_dispatch, so without this it would silently skip uploading.
      upload-tag-name: ${{ needs.tag.outputs.name }}
      # No provenance-name: the generator derives the filename from the subject
      # and reports it via the provenance-name output. Setting it explicitly left
      # needs.generator.outputs.provenance-name empty in upload-assets, and an
      # empty path there fails the artifact download.
